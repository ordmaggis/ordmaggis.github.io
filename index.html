<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito in manutenzione</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f9f7;
      font-family: 'Inter', sans-serif;
      color: #222;
    }

    .wrap {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 0.6rem;
    }

    p {
      font-size: 0.9rem;
      color: #888;
      font-weight: 300;
    }
  </style>

  <script>
    // Routing: /tests → tests.html (sostituisci con il tuo file)
    if (window.location.pathname === '/tests' || window.location.pathname === '/tests/') {
      window.location.replace('/tests.html');
    }
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Sito in manutenzione</h1>
    <p>Torneremo online a breve.</p>
  </div>
</body>
</html>
